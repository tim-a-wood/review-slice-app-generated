name: Build Windows package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Review-Slice-Windows
          path: release/*.zip
          if-no-files-found: error
